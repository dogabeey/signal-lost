patch_notes.artifacts: "ARTEFACTOS"
patch_notes.artifacts_1: "Presentamos el Sistema de Artefactos: una mecánica de logros que recompensa al jugador con bonificaciones y recompensas permanentes al cumplir ciertos objetivos."
patch_notes.artifacts_2: "Los Artefactos se obtienen principalmente al alcanzar 500 Células en el Nivel 2 y superiores."
patch_notes.artifacts_3: "Actualmente hay 10 Artefactos distintos; se añadirán más en próximas actualizaciones."
patch_notes.improvements: "MEJORAS"
patch_notes.improvements_1: "Diversas mejoras de la interfaz para aumentar la visibilidad, especialmente en dispositivos móviles."
patch_notes.improvements_2: "Pequeños ajustes de valores relacionados con los desbloqueos de Investigación y la fuerza de los Enemigos."
tip.1: "Con el tiempo acabarás siendo superado. Intenta desbloquear nuevas investigaciones para llegar más lejos."
tip.2: "Sigue moviéndote: quedarte quieto hace que sea mucho más difícil anticipar los peligros entrantes."
tip.3: "Los últimos segundos de vida de un enemigo se indican con un parpadeo."
tip.4: "Las mejoras de Investigación se conservan entre partidas, así que incluso una partida corta puede hacerte avanzar."
tip.5: "Usa el borde de la arena para reducir las direcciones desde las que pueden acercarse los enemigos."
tip.6: "Los Cronofragmentos son raros, valiosos y duran poco. Asegúrate de recogerlos antes de que desaparezcan."
tip.7: "Observa los anillos de alcance de los enemigos antes de decidir una ruta por la arena."
tip.8: "Más adelante en el juego puedes desbloquear potenciadores desde el Laboratorio de Investigación."
tip.9: "Tras alcanzar el Sector IV, puedes desbloquear la capacidad de construir Edificios que te ayuden en la arena."
tip.10: "Los enemigos púrpura se llaman Reptantes y aumentan gradualmente su velocidad con el tiempo. Las colisiones estáticas con obstáculos pueden ralentizarlos."
tip.11: "Los enemigos rojos se llaman Perseguidores y te perseguirán activamente. Las colisiones estáticas con obstáculos pueden ralentizarlos."
tip.12: "Los enemigos amarillos se llaman Explosivos y explotan después de unos segundos."
tip.13: "Cuantas más Células recoges, más difícil se vuelve el juego."
tip.14: "A medida que avanzas por el juego aparecen nuevos enemigos y obstáculos, así que prepárate para nuevos desafíos."
