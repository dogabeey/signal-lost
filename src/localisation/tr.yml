patch_notes.version_build: "SÜRÜM {version} · DERLEME {build}"
patch_notes.artifacts: "KALINTILAR"
patch_notes.artifacts_1: "Kalıntı Sistemi eklendi: Belirli hedefleri tamamladığınızda oyuncuyu kalıcı güçlendirmeler ve ödüllerle ödüllendiren bir başarım mekaniği."
patch_notes.artifacts_2: "Kalıntılar çoğunlukla 2. Kademe ve sonrasında 500 Hücreye ulaşılarak kazanılır."
patch_notes.artifacts_3: "Şu anda 10 farklı Kalıntı bulunuyor; gelecek güncellemelerde yenileri eklenecek."
patch_notes.improvements: "İYİLEŞTİRMELER"
patch_notes.improvements_1: "Özellikle mobil cihazlarda görünürlüğü artırmak için çeşitli arayüz iyileştirmeleri yapıldı."
patch_notes.improvements_2: "Araştırma kilitleri ve düşman güçleriyle ilgili küçük değer ayarlamaları yapıldı."
tip.1: "Eninde sonunda düşmanlar sizi bunaltacak. Daha ileri gidebilmek için yeni araştırmalar açmayı deneyin."
tip.2: "Hareket etmeye devam edin: Sabit durmak yaklaşan tehlikeleri okumayı çok daha zor hâle getirir."
tip.3: "Bir düşmanın ömrünün son saniyeleri yanıp sönmeyle belirtilir."
tip.4: "Araştırma yükseltmeleri seferler arasında kalıcıdır; bu yüzden kısa bir sefer bile ilerlemenizi sağlayabilir."
tip.5: "Düşmanların yaklaşabileceği yönleri azaltmak için arena kenarını kullanın."
tip.6: "Chronoshard nadir, değerli ve kısa ömürlüdür. Kaybolmadan önce topladığınızdan emin olun."
tip.7: "Arenada bir rota seçmeden önce düşmanların menzil halkalarını takip edin."
tip.8: "Oyunun ilerleyen bölümlerinde Araştırma Laboratuvarından güçlendiricilerin kilidini açabilirsiniz."
tip.9: "Sektör IV'e ulaştıktan sonra arenada size yardımcı olacak Yapılar inşa etme özelliğini açabilirsiniz."
tip.10: "Mor düşmanlara Sinsici denir ve zamanla giderek hızlanırlar. Engellere yaptıkları statik çarpışmalarla yavaşlatılabilirler."
tip.11: "Kırmızı düşmanlara Takipçi denir ve sizi etkin biçimde kovalarlar. Engellere yaptıkları statik çarpışmalarla yavaşlatılabilirler."
tip.12: "Sarı düşmanlara Patlayıcı denir ve birkaç saniye sonra patlarlar."
tip.13: "Ne kadar çok Hücre toplarsanız oyun o kadar zorlaşır."
tip.14: "Oyunda ilerledikçe yeni düşmanlar ve engeller ortaya çıkar; yeni zorluklara hazırlıklı olun."
