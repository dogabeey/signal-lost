patch_notes.artifacts: "ARTIFACTS"
patch_notes.artifacts_1: "Introducing Artifact System - An achievements mechanic which rewards the player with permanent buffs and rewards when achieving certain things."
patch_notes.artifacts_2: "Artifacts are mostly earned by reaching 500 cells in Tier 2 and onwards."
patch_notes.artifacts_3: "There are 10 different artifact right now, more to come in upcoming update."
patch_notes.improvements: "IMPROVEMENTS"
patch_notes.improvements_1: "Certain UI improvements for better visibility especially in mobile devices."
patch_notes.improvements_2: "Small value tweaks regarding Research unlocks and Enemy strengths."
tip.1: "You will eventually be overwhelmed. Try unlocking new researches to push further."
tip.2: "Keep moving: standing still makes incoming hazards much harder to read."
tip.3: "The final seconds of an enemy lifetime are marked by a blink."
tip.4: "Research upgrades persist between runs, so a short run can still move you forward."
tip.5: "Use the arena edge to reduce the directions enemies can approach from."
tip.6: "Chronoshards are rare, valuable and short-lived. Make sure to grab them before they disappear."
tip.7: "Watch enemy range rings before committing to a path through the arena."
tip.8: "You can unlock boosters later in the game from Research Lab."
tip.9: "After reaching Sector IV, you can unlock the ability to build Buildings to help you in the arena."
tip.10: "Purple enemies are called creepers and they speed up gradually over time. They can be slowed down by static collisions with obstacles."
tip.11: "Red enemies are called chasers and they will actively pursue you. They can be slowed down by static collisions with obstacles."
tip.12: "Yellow enemies are called bangers and they explode after a few seconds."
tip.13: "More cells you collect, the more difficult the game becomes."
tip.14: "New enemies and obstacles are introduced as you progress through the game, so be prepared for new challenges."
